<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AIGC 个性化公益广告实验平台</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f7fb,
                    #eef2f7
                );

            color: #1f2937;
        }

        .container {
            width: min(1180px, 94%);
            margin: 0 auto;
            padding: 35px 0 70px;
        }

        .hero {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow:
                0 15px 45px rgba(15, 23, 42, 0.08);

            margin-bottom: 25px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 34px;
            color: #111827;
        }

        .subtitle {
            color: #64748b;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        .email {
            color: #2563eb;
            font-weight: 600;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .history-btn {
            margin-top: 20px;
            padding: 11px 18px;
            border-radius: 10px;
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }

        .history-btn:hover {
            background: #e2e8f0;
        }

        .panel {
            background: white;
            border-radius: 22px;
            padding: 30px;
            box-shadow:
                0 15px 45px rgba(15, 23, 42, 0.07);

            margin-bottom: 25px;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dbe2ea;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        .slider-row {
            margin-top: 24px;
        }

        .slider-title {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .slider-title span:first-child {
            font-weight: 600;
        }

        .slider-value {
            color: #2563eb;
            font-weight: 700;
        }

        input[type="range"] {
            width: 100%;
        }

        .profile {
            margin-top: 25px;
            padding: 20px;
            border-radius: 15px;
            background: #f8fafc;
        }

        .profile-grid {
            display: grid;
            grid-template-columns:
                repeat(5, 1fr);

            gap: 12px;

            margin-top: 15px;
        }

        .profile-item {
            background: white;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .profile-score {
            font-size: 22px;
            font-weight: 800;
            margin-top: 5px;
            color: #2563eb;
        }

        .dominant {
            margin-top: 15px;
            color: #64748b;
        }

        .primary {
            width: 100%;
            margin-top: 25px;
            padding: 15px 20px;
            border-radius: 13px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            transition: 0.2s;
        }

        .primary:hover {
            background: #1d4ed8;
        }

        .primary:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .loader-panel {
            display: none;
        }

        .loader {
            width: 44px;
            height: 44px;
            border: 4px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }

        .status-text {
            font-size: 17px;
            font-weight: 600;
        }

        .status-detail {
            margin-top: 8px;
            color: #64748b;
            font-size: 14px;
        }

        .progress {
            margin-top: 18px;
            height: 10px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.5s ease;
        }

        .result {
            display: none;
        }

        .ads-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;
        }

        .ad-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 15px 40px rgba(15, 23, 42, 0.08);
        }

        .ad-card img {
            width: 100%;
            display: block;
            background: #f1f5f9;
        }

        .ad-body {
            padding: 25px;
        }

        .badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 999px;
            background: #eff6ff;
            color: #2563eb;
            font-weight: 700;
            font-size: 13px;
        }

        .copy {
            margin-top: 18px;
            font-size: 24px;
            line-height: 1.5;
            font-weight: 800;
            color: #111827;
        }

        .strategy {
            margin-top: 20px;
            padding: 18px;
            border-radius: 13px;
            background: #f8fafc;
            line-height: 1.7;
            font-size: 14px;
        }

        details {
            margin-top: 20px;
        }

        summary {
            cursor: pointer;
            font-weight: 600;
            color: #475569;
        }

        .prompt {
            margin-top: 12px;
            background: #0f172a;
            color: #e2e8f0;
            padding: 16px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.6;
        }

        .eval {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
        }

        .eval-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
            margin-top: 15px;
        }

        .eval-item label {
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #dbe2ea;
            background: white;
        }

        .history {
            display: none;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .back-btn {
            padding: 10px 15px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .history-list {
            display: grid;
            gap: 15px;
        }

        .history-item {
            padding: 20px;
            border-radius: 15px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            cursor: pointer;
        }

        .history-item:hover {
            border-color: #2563eb;
        }

        .history-topic {
            font-size: 18px;
            font-weight: 700;
        }

        .history-meta {
            margin-top: 8px;
            color: #64748b;
            font-size: 13px;
        }

        .history-progress {
            margin-top: 10px;
        }

        .error-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: 12px;
            white-space: pre-wrap;
        }

        .detail-view {
            display: none;
        }

        .detail-images {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .detail-images img {
            width: 100%;
            border-radius: 15px;
        }

        .muted {
            color: #64748b;
        }

        @media (max-width: 800px) {

            h1 {
                font-size: 26px;
            }

            .profile-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .ads-grid {
                grid-template-columns: 1fr;
            }

            .eval-grid {
                grid-template-columns: 1fr;
            }

            .detail-images {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<script>

const foundationNames = {

    care: "关怀 / 伤害",

    fairness: "公平 / 欺骗",

    loyalty: "忠诚 / 背叛",

    authority: "权威 / 颠覆",

    sanctity: "神圣 / 堕落"

};


const foundationLabels = {

    care: "Care",

    fairness: "Fairness",

    loyalty: "Loyalty",

    authority: "Authority",

    sanctity: "Sanctity"

};


const mftValues = {

    care: 8,

    fairness: 5,

    loyalty: 5,

    authority: 5,

    sanctity: 5

};


let currentExperimentId = null;

let polling = false;


/* =========================================================
   创建滑块
========================================================= */

function createSliders() {

    const container =
        document.getElementById(
            "sliders"
        );

    container.innerHTML = "";

    Object.keys(mftValues)
        .forEach(key => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "slider-row";

            row.innerHTML = `

                <div class="slider-title">

                    <span>
                        ${foundationNames[key]}
                    </span>

                    <span
                        class="slider-value"
                        id="${key}Value"
                    >
                        ${mftValues[key]}
                    </span>

                </div>

                <input
                    type="range"
                    min="0"
                    max="10"
                    step="0.1"
                    value="${mftValues[key]}"
                    id="${key}"
                >

            `;

            container.appendChild(
                row
            );

            document
                .getElementById(key)
                .addEventListener(
                    "input",
                    updateProfile
                );

        });

    updateProfile();

}


/* =========================================================
   MFT画像
========================================================= */

function getMFT() {

    return {

        care:
            Number(
                document
                    .getElementById("care")
                    .value
            ),

        fairness:
            Number(
                document
                    .getElementById("fairness")
                    .value
            ),

        loyalty:
            Number(
                document
                    .getElementById("loyalty")
                    .value
            ),

        authority:
            Number(
                document
                    .getElementById("authority")
                    .value
            ),

        sanctity:
            Number(
                document
                    .getElementById("sanctity")
                    .value
            )

    };

}


/* =========================================================
   更新画像
========================================================= */

function updateProfile() {

    const scores =
        getMFT();

    Object.keys(scores)
        .forEach(key => {

            document
                .getElementById(
                    key + "Value"
                )
                .textContent =
                scores[key];

        });

    const profile =
        document.getElementById(
            "profile"
        );

    profile.innerHTML = "";

    Object.entries(scores)
        .forEach(([key, value]) => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "profile-item";

            item.innerHTML = `

                <div>
                    ${foundationLabels[key]}
                </div>

                <div class="profile-score">
                    ${value}
                </div>

            `;

            profile.appendChild(
                item
            );

        });

    const sorted =
        Object.entries(scores)
            .sort(
                (a, b) =>
                    b[1] - a[1]
            );

    const highest =
        sorted[0];

    const lowest =
        sorted[sorted.length - 1];

    document
        .getElementById(
            "dominant"
        )
        .innerHTML =

        `当前最高道德基础：
        <b>${foundationNames[highest[0]]}</b>
        (${highest[1]})
        ，
        最低道德基础：
        <b>${foundationNames[lowest[0]]}</b>
        (${lowest[1]})`;

}


/* =========================================================
   生成
========================================================= */

document
    .getElementById("generate")
    .addEventListener(
        "click",
        startGeneration
    );


async function startGeneration() {

    const topic =
        document
            .getElementById("topic")
            .value
            .trim();

    if (!topic) {

        alert(
            "请输入公益广告主题。"
        );

        return;

    }

    if (polling) {

        return;

    }

    const button =
        document.getElementById(
            "generate"
        );

    button.disabled = true;

    document
        .getElementById(
            "result"
        )
        .style.display = "none";

    document
        .getElementById(
            "errorBox"
        )
        .style.display = "none";

    document
        .getElementById(
            "loaderPanel"
        )
        .style.display = "block";

    setProgress(
        5,
        "正在创建实验……",
        "正在初始化实验任务"
    );

    try {

        const response =
            await fetch(
                "/api/generate",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        topic: topic,

                        mft: getMFT()

                    })

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "创建实验失败"
            );

        }

        currentExperimentId =
            data.experiment_id;

        polling = true;

        await pollStatus();

    }

    catch (error) {

        showError(
            error.message
        );

        button.disabled = false;

        polling = false;

    }

}


/* =========================================================
   轮询
========================================================= */

async function pollStatus() {

    if (!currentExperimentId) {

        return;

    }

    try {

        const response =
            await fetch(

                `/api/generate/status/${currentExperimentId}`,

                {

                    method: "GET",

                    cache: "no-store"

                }

            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "状态查询失败"
            );

        }

        handleStatus(
            data
        );

        if (
            data.status ===
            "completed"
        ) {

            polling = false;

            document
                .getElementById(
                    "generate"
                )
                .disabled = false;

            renderResult(
                data
            );

            return;

        }

        if (
            data.status ===
            "failed"
        ) {

            polling = false;

            document
                .getElementById(
                    "generate"
                )
                .disabled = false;

            showError(
                data.error ||
                "实验生成失败"
            );

            return;

        }

        setTimeout(
            pollStatus,
            2500
        );

    }

    catch (error) {

        polling = false;

        document
            .getElementById(
                "generate"
            )
            .disabled = false;

        showError(
            "浏览器无法取得后端响应。\n\n" +
            error.message
        );

    }

}


/* =========================================================
   状态文字
========================================================= */

function handleStatus(data) {

    const stage =
        data.stage || "";

    let main =
        "AI正在处理……";

    let detail =
        "";

    if (
        stage ===
        "pending_llm"
        ||
        stage ===
        "llm_processing"
    ) {

        main =
            "🤖 AI正在生成公益广告策略";

        detail =
            "正在分析MFT道德画像并生成文案与视觉Prompt";

    }

    else if (
        stage ===
        "pending_matched_image"
        ||
        stage ===
        "matched_image_processing"
    ) {

        main =
            "🎨 正在生成匹配条件公益海报";

        detail =
            "正在根据匹配MFT道德诉求生成视觉海报";

    }

    else if (
        stage ===
        "pending_unmatched_image"
        ||
        stage ===
        "unmatched_image_processing"
    ) {

        main =
            "🎨 正在生成不匹配条件公益海报";

        detail =
            "正在根据不匹配MFT道德诉求生成第二张海报";

    }

    else if (
        stage ===
        "completed"
    ) {

        main =
            "🎉 实验生成完成";

        detail =
            "两张公益海报已经保存";

    }

    setProgress(
        data.progress || 0,
        main,
        detail
    );

}


function setProgress(
    progress,
    main,
    detail
) {

    document
        .getElementById(
            "progressBar"
        )
        .style.width =
        `${progress}%`;

    document
        .getElementById(
            "statusMain"
        )
        .textContent =
        main;

    document
        .getElementById(
            "statusDetail"
        )
        .textContent =
        detail;

}


/* =========================================================
   显示结果
========================================================= */

function renderResult(data) {

    document
        .getElementById(
            "loaderPanel"
        )
        .style.display = "none";

    document
        .getElementById(
            "result"
        )
        .style.display = "block";

    const matched =
        data.matched;

    const unmatched =
        data.unmatched;

    if (!matched || !unmatched) {

        showError(
            "后端返回成功，但缺少两张广告数据。"
        );

        return;

    }

    document
        .getElementById(
            "resultSummary"
        )
        .innerHTML = `

            <b>主题：</b>
            ${escapeHtml(data.topic)}

            <br>

            <b>匹配：</b>
            ${foundationNames[data.matched_foundation]}

            <br>

            <b>不匹配：</b>
            ${foundationNames[data.unmatched_foundation]}

            <br>

            <b>实验ID：</b>
            ${data.experiment_id}

        `;

    renderAd(
        "matched",
        matched
    );

    renderAd(
        "unmatched",
        unmatched
    );

    fillEvaluationSelects();

}


/* =========================================================
   广告
========================================================= */

function renderAd(
    type,
    ad
) {

    const prefix =
        type === "matched"
            ? "matched"
            : "unmatched";

    document
        .getElementById(
            prefix + "Img"
        )
        .src =
        ad.image_url;

    document
        .getElementById(
            prefix + "Copy"
        )
        .textContent =
        ad.copy || "";

    document
        .getElementById(
            prefix + "Badge"
        )
        .textContent =
        type === "matched"
            ? `匹配条件 · ${foundationNames[ad.foundation]}`
            : `不匹配条件 · ${foundationNames[ad.foundation]}`;

    const strategy =
        ad.strategy || {};

    document
        .getElementById(
            prefix + "Strategy"
        )
        .innerHTML = `

            <b>核心价值：</b>
            ${escapeHtml(strategy.core_value || "")}

            <br><br>

            <b>情绪：</b>
            ${escapeHtml(
                Array.isArray(strategy.emotion)
                    ? strategy.emotion.join("、")
                    : ""
            )}

            <br><br>

            <b>叙事：</b>
            ${escapeHtml(strategy.narrative || "")}

            <br><br>

            <b>视觉隐喻：</b>
            ${escapeHtml(strategy.visual_metaphor || "")}

            <br><br>

            <b>视觉主体：</b>
            ${escapeHtml(strategy.visual_subject || "")}

            <br><br>

            <b>构图：</b>
            ${escapeHtml(strategy.composition || "")}

            <br><br>

            <b>光线：</b>
            ${escapeHtml(strategy.lighting || "")}

            <br><br>

            <b>字体：</b>
            ${escapeHtml(strategy.typography_style || "")}

        `;

    document
        .getElementById(
            prefix + "Prompt"
        )
        .textContent =
        ad.image_prompt || "";

}


/* =========================================================
   评价
========================================================= */

function fillEvaluationSelects() {

    const ids = [

        "m_moral",
        "m_emotion",
        "m_persuasion",
        "m_behavior",

        "u_moral",
        "u_emotion",
        "u_persuasion",
        "u_behavior"

    ];

    ids.forEach(id => {

        const select =
            document
                .getElementById(id);

        select.innerHTML = "";

        for (
            let i = 1;
            i <= 7;
            i++
        ) {

            const option =
                document.createElement(
                    "option"
                );

            option.value = i;

            option.textContent =
                `${i} 分`;

            select.appendChild(
                option
            );

        }

    });

}


async function submitEval(
    condition
) {

    if (!currentExperimentId) {

        alert(
            "当前没有实验。"
        );

        return;

    }

    const prefix =
        condition === "matched"
            ? "m"
            : "u";

    const adId =
        condition === "matched"
            ? document
                .getElementById(
                    "matchedImg"
                )
                .dataset.adId
            : document
                .getElementById(
                    "unmatchedImg"
                )
                .dataset.adId;

    if (!adId) {

        alert(
            "找不到广告ID。"
        );

        return;

    }

    const body = {

        experiment_id:
            currentExperimentId,

        ad_id:
            adId,

        moral_resonance:
            Number(
                document
                    .getElementById(
                        prefix + "_moral"
                    )
                    .value
            ),

        emotional_response:
            Number(
                document
                    .getElementById(
                        prefix + "_emotion"
                    )
                    .value
            ),

        persuasion:
            Number(
                document
                    .getElementById(
                        prefix + "_persuasion"
                    )
                    .value
            ),

        behavioral_intention:
            Number(
                document
                    .getElementById(
                        prefix + "_behavior"
                    )
                    .value
            )

    };

    try {

        const response =
            await fetch(
                "/api/evaluate",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body)

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "评价提交失败"
            );

        }

        alert(
            "评价提交成功！"
        );

    }

    catch (error) {

        alert(
            "评价提交失败：\n" +
            error.message
        );

    }

}


/* =========================================================
   历史记录
========================================================= */

async function showHistory() {

    document
        .getElementById(
            "currentView"
        )
        .style.display = "none";

    document
        .getElementById(
            "detailView"
        )
        .style.display = "none";

    document
        .getElementById(
            "historyView"
        )
        .style.display = "block";

    const list =
        document
            .getElementById(
                "historyList"
            );

    list.innerHTML =
        "正在读取历史记录……";

    try {

        const response =
            await fetch(
                "/api/history",
                {
                    cache:
                        "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||
                "读取失败"
            );

        }

        if (
            !data.history ||
            data.history.length === 0
        ) {

            list.innerHTML =
                `<div class="muted">
                    暂时没有历史实验。
                </div>`;

            return;

        }

        list.innerHTML = "";

        data.history.forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "history-item";

                div.onclick =
                    () =>
                        showHistoryDetail(
                            item.experiment_id
                        );

                div.innerHTML = `

                    <div class="history-topic">
                        ${escapeHtml(item.topic)}
                    </div>

                    <div class="history-meta">

                        实验ID：
                        ${item.experiment_id}

                        <br>

                        匹配：
                        ${foundationNames[item.matched_foundation]}

                        <br>

                        不匹配：
                        ${foundationNames[item.unmatched_foundation]}

                        <br>

                        状态：
                        ${item.status}

                        <br>

                        创建时间：
                        ${item.created_at || ""}

                    </div>

                `;

                list.appendChild(
                    div
                );

            }
        );

    }

    catch (error) {

        list.innerHTML =
            `<div class="error-box"
                  style="display:block">
                ${escapeHtml(
                    error.message
                )}
            </div>`;

    }

}


function backToCurrent() {

    document
        .getElementById(
            "historyView"
        )
        .style.display = "none";

    document
        .getElementById(
            "detailView"
        )
        .style.display = "none";

    document
        .getElementById(
            "currentView"
        )
        .style.display = "block";

}

async function showHistoryDetail(

) {

    document
        .getElementById(
            "historyView"
        )
        .style.display = "none";

    document
        .getElementById(
            "currentView"
        )
        .style.display = "none";

    document
        .getElementById(
            "detailView"
        )
        .style.display = "block";

    const content =
        document
            .getElementById(
                "detailContent"
            );

    content.innerHTML =
        "正在读取实验详情……";

    try {

        const response =
            await fetch(
                `/api/history/${experimentId}`,
                {
                    cache:
                        "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail ||

            );

        }

        currentExperimentId =
            data.experiment_id;

        content.innerHTML = `

            <h3>
                ${escapeHtml(data.topic)}
            </h3>

            <p class="muted">

                匹配：
                ${foundationNames[data.matched_foundation]}

                <br>

                不匹配：
                ${foundationNames[data.unmatched_foundation]}

                <br>

                创建时间：
                ${data.created_at || ""}

            </p>

            <div class="detail-images">

                ${
                    data.matched
                    ? `
                        <div>
                            <h3>
                                匹配条件
                            </h3>

                            <img
                                src="${data.matched.image_url}"
                            >

                            <p>
                                ${escapeHtml(
                                    data.matched.copy
                                )}
                            </p>
                        </div>
                    `
                    : ""
                }

                ${
                    data.unmatched
                    ? `
                        <div>
                            <h3>
                                不匹配条件
                            </h3>

                            <img
                                src="${data.unmatched.image_url}"
                            >

                            <p>
                                ${escapeHtml(
                                    data.unmatched.copy
                                )}
                            </p>
                        </div>
                    `
                    : ""
                }

            </div>

        `;

    }

    catch (error) {

        content.innerHTML =
            `<div class="error-box"
                  style="display:block">
                ${escapeHtml(
                    error.message
                )}
            </div>`;

    }

}


/* =========================================================
   工具
========================================================= */

function showError(message) {

    document
        .getElementById(
            "loaderPanel"
        )
        .style.display = "none";

    const box =
        document
            .getElementById(
                "errorBox"
            );

    box.textContent =
        "生成失败：\n\n" +
        message;

    box.style.display =
        "block";

}


function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

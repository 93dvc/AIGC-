<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AIGC 个性化公益广告实验平台</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #f4f7fb,
            #eef2f7
        );

    color: #1f2937;
}

.container {
    width: min(
        1200px,
        calc(100% - 32px)
    );

    margin: 30px auto 60px;
}

.header {
    background: white;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 20px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.06);
}

h1 {
    margin: 0 0 12px;
    font-size: 30px;
}

.subtitle {
    color: #64748b;
    line-height: 1.8;
}

.email {
    margin-top: 12px;
    color: #2563eb;
    font-weight: 600;
}

button {
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.primary {
    width: 100%;
    padding: 14px;
    background: #2563eb;
    color: white;
    font-weight: 700;
}

.primary:hover {
    background: #1d4ed8;
}

.history-btn,
.back-btn {
    padding: 10px 16px;
    background: #eef2ff;
    color: #3730a3;
}

.section {
    background: white;
    border-radius: 20px;
    padding: 26px;
    margin-bottom: 20px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.05);
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: 700;
}

input[type="text"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 20px;
}

.slider-row {
    margin-bottom: 20px;
}

.slider-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
}

.slider {
    width: 100%;
}

.profile {
    margin: 22px 0;
    padding: 18px;
    background: #f8fafc;
    border-radius: 14px;
}

.profile-item {
    display: inline-block;
    margin: 6px;
    padding: 7px 12px;
    background: white;
    border-radius: 8px;
}

.muted {
    color: #64748b;
    margin-top: 10px;
}

.loader {
    width: 42px;
    height: 42px;
    border-radius: 50%;

    border: 4px solid #e5e7eb;
    border-top-color: #2563eb;

    animation: spin 1s linear infinite;

    margin: 10px auto;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.hidden {
    display: none !important;
}

.progress {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0;
    background: #2563eb;
    transition: width .4s ease;
}

.status-text {
    text-align: center;
    padding: 10px;
    color: #475569;
}

.ads-grid {
    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 20px;
}

.ad-card {
    background: white;
    border-radius: 20px;
    overflow: hidden;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.07);
}

.ad-card img {
    width: 100%;
    display: block;
    background: #f1f5f9;
}

.ad-body {
    padding: 22px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 8px;

    background: #dbeafe;
    color: #1d4ed8;

    font-size: 13px;
    font-weight: 700;

    margin-bottom: 12px;
}

.copy {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.5;
    margin-bottom: 15px;
}

.strategy {
    color: #475569;
    line-height: 1.7;
    white-space: pre-wrap;
}

details {
    margin-top: 15px;
}

summary {
    cursor: pointer;
    font-weight: 700;
}

.prompt {
    margin-top: 10px;
    background: #0f172a;
    color: #e2e8f0;

    padding: 14px;
    border-radius: 10px;

    white-space: pre-wrap;
    word-break: break-word;

    font-size: 12px;
    line-height: 1.6;
}

.eval {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
}

.eval-grid {
    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap: 12px;
    margin-top: 12px;
}

.eval-item select {
    width: 100%;
    padding: 10px;

    border:
        1px solid
        #d1d5db;

    border-radius: 8px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.history-item {
    padding: 18px;
    background: #f8fafc;
    border-radius: 12px;
    margin-bottom: 12px;
    cursor: pointer;
}

.history-item:hover {
    background: #eef2ff;
}

.history-topic {
    font-weight: 800;
    font-size: 17px;
}

.history-time {
    color: #64748b;
    margin-top: 5px;
    font-size: 13px;
}

.history-detail {
    line-height: 1.7;
}

@media (max-width: 800px) {

    .ads-grid {
        grid-template-columns: 1fr;
    }

    .eval-grid {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 24px;
    }
}

</style>
</head>


<body>

<div class="container">

    <div class="header">

        <h1>
            AIGC 个性化公益广告实验平台
        </h1>

        <div class="subtitle">
            人工设定 MFT 道德画像
            →
            AI生成传播策略、文案与视觉Prompt
            →
            生成匹配 / 不匹配公益海报
        </div>

        <div class="email">
            一起做得更好：li93dvc@gmail.com
        </div>

        <br>

        <button
            class="history-btn"
            onclick="showHistory()"
        >
            📚 历史实验
        </button>

    </div>


    <!-- 当前实验 -->

    <div id="currentView">

        <div class="section">

            <h2>
                ① 实验输入
            </h2>

            <label for="topic">
                公益广告主题
            </label>

            <input
                id="topic"
                type="text"
                placeholder="例如：海洋塑料污染"
            >

            <div id="sliders"></div>

            <div class="profile">

                <strong>
                    当前MFT画像
                </strong>

                <div id="profile"></div>

                <div
                    class="muted"
                    id="dominant"
                ></div>

            </div>

            <button
                class="primary"
                id="generate"
                onclick="startExperiment()"
            >
                生成匹配 / 不匹配广告
            </button>

        </div>


        <div
            class="section hidden"
            id="loadingSection"
        >

            <div
                class="loader"
                id="loader"
            ></div>

            <div class="status-text">

                <div id="statusMain">
                    AI正在准备实验……
                </div>

                <div
                    class="progress"
                    id="progress"
                >

                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>

                </div>

            </div>

        </div>


        <div
            class="section"
            id="emptySection"
        >

            先输入公益主题和五维 MFT 分数。

            <br><br>

            然后点击“生成匹配 / 不匹配广告”。

            <br><br>

            系统将自动生成：

            <br>

            <b>
                两套不同MFT道德诉求的公益广告
            </b>

        </div>


        <div
            id="results"
            class="ads-grid"
        ></div>

    </div>


    <!-- 历史 -->

    <div
        id="historyView"
        class="hidden"
    >

        <div class="section">

            <div class="history-header">

                <h2>
                    📚 历史实验记录
                </h2>

                <button
                    class="back-btn"
                    onclick="backToCurrent()"
                >
                    ← 返回当前实验
                </button>

            </div>

            <div
                id="historyList"
            ></div>

        </div>

    </div>

</div>


<script>

const FOUNDATIONS = {

    care: "关怀 / 伤害",
    fairness: "公平 / 欺骗",
    loyalty: "忠诚 / 背叛",
    authority: "权威 / 颠覆",
    sanctity: "神圣 / 堕落"

};


const SLIDERS = [
    ["care", "Care / Harm"],
    ["fairness", "Fairness / Cheating"],
    ["loyalty", "Loyalty / Betrayal"],
    ["authority", "Authority / Subversion"],
    ["sanctity", "Sanctity / Degradation"]
];


function createSliders() {

    const container =
        document.getElementById(
            "sliders"
        );

    container.innerHTML = "";

    SLIDERS.forEach(
        ([key, label]) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "slider-row";

            row.innerHTML = `

                <div class="slider-header">

                    <span>
                        ${label}
                    </span>

                    <strong id="${key}Value">
                        5
                    </strong>

                </div>

                <input
                    class="slider"
                    id="${key}"
                    type="range"
                    min="0"
                    max="10"
                    step="0.1"
                    value="5"
                    oninput="updateProfile()"
                >

            `;

            container.appendChild(
                row
            );

        }
    );

    updateProfile();
}


function getMFT() {

    return {

        care:
            Number(
                document.getElementById(
                    "care"
                ).value
            ),

        fairness:
            Number(
                document.getElementById(
                    "fairness"
                ).value
            ),

        loyalty:
            Number(
                document.getElementById(
                    "loyalty"
                ).value
            ),

        authority:
            Number(
                document.getElementById(
                    "authority"
                ).value
            ),

        sanctity:
            Number(
                document.getElementById(
                    "sanctity"
                ).value
            )

    };

}


function updateProfile() {

    const mft =
        getMFT();

    let html = "";

    for (
        const [key, label]
        of SLIDERS
    ) {

        const value =
            mft[key];

        document.getElementById(
            `${key}Value`
        ).textContent =
            value;

        html += `

            <span class="profile-item">

                ${label}：

                <b>
                    ${value}
                </b>

            </span>

        `;

    }

    document.getElementById(
        "profile"
    ).innerHTML = html;

    const sorted =
        Object.entries(
            mft
        ).sort(
            (a,b) => b[1] - a[1]
        );

    const max =
        sorted[0];

    const min =
        sorted[sorted.length - 1];

    document.getElementById(
        "dominant"
    ).textContent =
        `最高：${FOUNDATIONS[max[0]]} (${max[1]})　` +
        `最低：${FOUNDATIONS[min[0]]} (${min[1]})`;

}


function setStatus(
    text,
    progress
) {

    document.getElementById(
        "statusMain"
    ).textContent =
        text;

    document.getElementById(
        "progressBar"
    ).style.width =
        `${progress}%`;

}


async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            {
                ...options,
                headers: {
                    "Content-Type":
                        "application/json",
                    ...(options.headers || {})
                }
            }
        );

    let data;

    try {
        data =
            await response.json();
    }
    catch {
        data = {};
    }

    if (!response.ok) {

        throw new Error(
            data.detail ||
            data.message ||
            `HTTP ${response.status}`
        );

    }

    return data;
}


async function startExperiment() {

    const topic =
        document.getElementById(
            "topic"
        ).value.trim();

    if (topic.length < 2) {

        alert(
            "请输入公益广告主题。"
        );

        return;
    }

    const button =
        document.getElementById(
            "generate"
        );

    button.disabled = true;

    document.getElementById(
        "loadingSection"
    ).classList.remove(
        "hidden"
    );

    document.getElementById(
        "emptySection"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "results"
    ).innerHTML = "";

    try {

        // ------------------------------------------------
        // 第一步：LLM
        // ------------------------------------------------

        setStatus(
            "🤖 AI正在生成两套公益广告策略……",
            10
        );

        const strategy =
            await api(
                "/api/generate",
                {
                    method: "POST",

                    body:
                        JSON.stringify(
                            {
                                topic,
                                mft:
                                    getMFT()
                            }
                        )
                }
            );


        const experimentId =
            strategy.experiment_id;


        // ------------------------------------------------
        // 第二步：两张图片并行
        // ------------------------------------------------

        setStatus(
            "🎨 两张公益海报正在并行生成……",
            35
        );


        const matchedPromise =
            api(
                "/api/generate-image",
                {
                    method: "POST",

                    body:
                        JSON.stringify(
                            {
                                experiment_id:
                                    experimentId,

                                condition:
                                    "matched",

                                image_prompt:
                                    strategy
                                    .matched
                                    .image_prompt
                            }
                        )
                }
            );


        const unmatchedPromise =
            api(
                "/api/generate-image",
                {
                    method: "POST",

                    body:
                        JSON.stringify(
                            {
                                experiment_id:
                                    experimentId,

                                condition:
                                    "unmatched",

                                image_prompt:
                                    strategy
                                    .unmatched
                                    .image_prompt
                            }
                        )
                }
            );


        const [
            matchedImage,
            unmatchedImage
        ] =
            await Promise.all(
                [
                    matchedPromise,
                    unmatchedPromise
                ]
            );


        setStatus(
            "💾 图片生成完成，正在保存实验……",
            85
        );


        const matched =
            {
                ...strategy.matched,
                image_url:
                    matchedImage.image_url
            };


        const unmatched =
            {
                ...strategy.unmatched,
                image_url:
                    unmatchedImage.image_url
            };


        // ------------------------------------------------
        // 第三步：保存
        // ------------------------------------------------

        await api(
            "/api/finalize",
            {
                method: "POST",

                body:
                    JSON.stringify(
                        {
                            experiment_id:
                                experimentId,

                            topic,

                            mft:
                                getMFT(),

                            matched_foundation:
                                strategy
                                .matched_foundation,

                            unmatched_foundation:
                                strategy
                                .unmatched_foundation,

                            matched,

                            unmatched
                        }
                    )
            }
        );


        setStatus(
            "🎉 实验生成完成！",
            100
        );


        renderResults(
            strategy,
            matched,
            unmatched
        );


    }
    catch (error) {

        console.error(
            error
        );

        alert(
            "生成失败：\n\n" +
            error.message
        );

        setStatus(
            "❌ 生成失败：" +
            error.message,
            0
        );

    }
    finally {

        button.disabled =
            false;

    }

}


function strategyText(
    strategy
) {

    if (!strategy) {
        return "";
    }

    const emotion =
        Array.isArray(
            strategy.emotion
        )
            ? strategy.emotion.join(
                "、"
            )
            : "";

    return (

        `核心价值：${strategy.core_value || ""}\n` +

        `情绪：${emotion}\n` +

        `叙事：${strategy.narrative || ""}\n` +

        `视觉隐喻：${strategy.visual_metaphor || ""}\n` +

        `视觉主体：${strategy.visual_subject || ""}\n` +

        `构图：${strategy.composition || ""}\n` +

        `光线：${strategy.lighting || ""}\n` +

        `字体：${strategy.typography_style || ""}`

    );

}


function escapeHtml(
    text
) {

    if (text === null ||
        text === undefined) {
        return "";
    }

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function renderResults(
    strategy,
    matched,
    unmatched
) {

    const results =
        document.getElementById(
            "results"
        );

    results.innerHTML = "";


    results.appendChild(
        createAdCard(
            "matched",
            strategy.matched,
            matched
        )
    );


    results.appendChild(
        createAdCard(
            "unmatched",
            strategy.unmatched,
            unmatched
        )
    );

}


function createAdCard(
    condition,
    strategy,
    image
) {

    const card =
        document.createElement(
            "div"
        );

    card.className =
        "ad-card";


    const prefix =
        condition === "matched"
            ? "m"
            : "u";


    const badge =
        condition === "matched"
            ? "匹配条件"
            : "不匹配条件";


    card.innerHTML = `

        <img
            src="${escapeHtml(
                image.image_url
            )}"
            alt="${badge}公益海报"
        >

        <div class="ad-body">

            <div class="badge">
                ${badge}
            </div>

            <div class="copy">
                ${escapeHtml(
                    strategy.copy
                )}
            </div>

            <div class="strategy">
                ${escapeHtml(
                    strategyText(
                        strategy.strategy
                    )
                )}
            </div>

            <details>

                <summary>
                    查看AI生成的视觉Prompt
                </summary>

                <div class="prompt">
                    ${escapeHtml(
                        strategy.image_prompt
                    )}
                </div>

            </details>

            <div class="eval">

                <strong>
                    广告评价
                </strong>

                <div class="eval-grid">

                    ${evalSelect(
                        `${prefix}_moral`,
                        "道德共鸣"
                    )}

                    ${evalSelect(
                        `${prefix}_emotion`,
                        "情感反应"
                    )}

                    ${evalSelect(
                        `${prefix}_persuasion`,
                        "说服效果"
                    )}

                    ${evalSelect(
                        `${prefix}_behavior`,
                        "行为意愿"
                    )}

                </div>

                <button
                    class="primary"
                    style="margin-top:12px"
                    onclick="submitEval(
                        '${condition}',
                        '${image.ad_id || ""}',
                        '${currentExperimentId}'
                    )"
                >
                    提交评价
                </button>

            </div>

        </div>

    `;


    return card;

}


function evalSelect(
    id,
    label
) {

    let options = "";

    for (
        let i = 1;
        i <= 7;
        i++
    ) {

        options += `
            <option value="${i}">
                ${i}
            </option>
        `;

    }

    return `

        <div class="eval-item">

            <label>
                ${label}
            </label>

            <select id="${id}">
                ${options}
            </select>

        </div>

    `;

}


let currentExperimentId =
    null;


async function submitEval(
    condition,
    adId,
    experimentId
) {

    if (!adId) {

        alert(
            "广告ID不存在，请刷新后重新生成。"
        );

        return;
    }


    const prefix =
        condition === "matched"
            ? "m"
            : "u";


    try {

        await api(
            "/api/evaluate",
            {
                method: "POST",

                body:
                    JSON.stringify(
                        {
                            experiment_id:
                                experimentId,

                            ad_id:
                                adId,

                            moral_resonance:
                                Number(
                                    document.getElementById(
                                        `${prefix}_moral`
                                    ).value
                                ),

                            emotional_response:
                                Number(
                                    document.getElementById(
                                        `${prefix}_emotion`
                                    ).value
                                ),

                            persuasion:
                                Number(
                                    document.getElementById(
                                        `${prefix}_persuasion`
                                    ).value
                                ),

                            behavioral_intention:
                                Number(
                                    document.getElementById(
                                        `${prefix}_behavior`
                                    ).value
                                )
                        }
                    )
            }
        );


        alert(
            "评价提交成功！"
        );

    }
    catch (error) {

        alert(
            "评价提交失败：\n" +
            error.message
        );

    }

}


async function showHistory() {

    document.getElementById(
        "currentView"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "historyView"
    ).classList.remove(
        "hidden"
    );


    const list =
        document.getElementById(
            "historyList"
        );

    list.innerHTML =
        "正在读取历史记录……";


    try {

        const data =
            await api(
                "/api/history"
            );


        if (!data.history.length) {

            list.innerHTML =
                "暂无历史实验。";

            return;
        }


        list.innerHTML = "";


        data.history.forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );

                div.className =
                    "history-item";


                div.innerHTML = `

                    <div class="history-topic">
                        ${escapeHtml(
                            item.topic
                        )}
                    </div>

                    <div class="history-time">
                        ${escapeHtml(
                            item.created_at
                        )}
                    </div>

                    <div>
                        匹配：
                        ${escapeHtml(
                            FOUNDATIONS[
                                item.matched_foundation
                            ] ||
                            item.matched_foundation
                        )}
                        <br>
                        不匹配：
                        ${escapeHtml(
                            FOUNDATIONS[
                                item.unmatched_foundation
                            ] ||
                            item.unmatched_foundation
                        )}
                    </div>

                    <div class="muted">
                        广告：
                        ${item.ad_count}
                       　
                        评价：
                        ${item.evaluation_count}
                    </div>

                `;


                div.onclick =
                    () => loadHistory(
                        item.experiment_id
                    );


                list.appendChild(
                    div
                );

            }
        );

    }
    catch (error) {

        list.innerHTML =
            `读取失败：${escapeHtml(
                error.message
            )}`;

    }

}


async function loadHistory(
    experimentId
) {

    try {

        const data =
            await api(
                `/api/history/${experimentId}`
            );


        document.getElementById(
            "historyView"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "currentView"
        ).classList.remove(
            "hidden"
        );


        currentExperimentId =
            data.experiment_id;


        document.getElementById(
            "emptySection"
        ).classList.add(
            "hidden"
        );


        document.getElementById(
            "loadingSection"
        ).classList.add(
            "hidden"
        );


        renderHistoryResults(
            data
        );

    }
    catch (error) {

        alert(
            "读取历史实验失败：\n" +
            error.message
        );

    }

}


function renderHistoryResults(
    data
) {

    const results =
        document.getElementById(
            "results"
        );

    results.innerHTML = "";


    [
        [
            "matched",
            data.matched
        ],
        [
            "unmatched",
            data.unmatched
        ]
    ].forEach(
        ([condition, item]) => {

            if (!item) {
                return;
            }


            const strategy =
                {
                    copy:
                        item.copy,

                    strategy:
                        item.strategy,

                    image_prompt:
                        item.image_prompt
                };


            results.appendChild(
                createAdCard(
                    condition,
                    strategy,
                    item
                )
            );

        }
    );

}


function backToCurrent() {

    document.getElementById(
        "historyView"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "currentView"
    ).classList.remove(
        "hidden"
    );

}


createSliders();

</script>

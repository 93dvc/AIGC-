<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AIGC 个性化公益广告实验平台</title>


<style>

/* ==========================================================
   全局
========================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    font-family:
        Inter,
        "Microsoft YaHei",
        Arial,
        sans-serif;

    background: #f5f7fb;

    color: #172033;
}


.container {

    max-width: 1320px;

    margin: auto;

    padding:
        32px
        20px
        60px;
}


/* ==========================================================
   顶部
========================================================== */

.page-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 24px;
}


h1 {

    margin:
        0
        0
        8px;

    font-size: 30px;
}


.subtitle {

    color: #6b7280;

    line-height: 1.6;
}


/* ==========================================================
   按钮
========================================================== */

button {

    border: 0;

    border-radius: 11px;

    padding:
        12px
        18px;

    font-weight: 700;

    cursor: pointer;
}


.primary {

    width: 100%;

    background: #4f46e5;

    color: white;

    margin-top: 18px;
}


.primary:disabled {

    opacity: .5;

    cursor:
        not-allowed;
}


.history-btn {

    background: white;

    color: #4338ca;

    border:
        1px solid
        #dfe2ff;

    padding:
        11px
        18px;

    white-space: nowrap;
}


.history-btn:hover {

    background:
        #f5f5ff;
}


.back-btn {

    background:
        #f1f3f8;

    color:
        #374151;
}


/* ==========================================================
   主布局
========================================================== */

.grid {

    display: grid;

    grid-template-columns:
        340px
        1fr;

    gap: 20px;
}


/* ==========================================================
   卡片
========================================================== */

.card {

    background:
        white;

    border:
        1px solid
        #e5e7eb;

    border-radius:
        18px;

    padding:
        22px;

    box-shadow:
        0 8px 30px
        rgba(20, 30, 50, .05);
}


h2 {

    font-size:
        18px;

    margin:
        0
        0
        18px;
}


/* ==========================================================
   输入
========================================================== */

label {

    display:
        block;

    font-weight:
        600;

    margin:
        14px
        0
        8px;
}


input[type=text] {

    width: 100%;

    padding:
        12px;

    border:
        1px solid
        #d7dce5;

    border-radius:
        10px;

    font-size:
        15px;
}


.score-row {

    margin:
        15px
        0;
}


.score-top {

    display: flex;

    justify-content:
        space-between;

    font-size:
        14px;
}


input[type=range] {

    width: 100%;

    accent-color:
        #4f46e5;
}


/* ==========================================================
   MFT画像
========================================================== */

.profile {

    margin-top:
        18px;

    padding:
        15px;

    background:
        #f7f7ff;

    border-radius:
        12px;
}


.bar {

    height:
        8px;

    background:
        #e8eaf0;

    border-radius:
        20px;

    overflow:
        hidden;

    margin-top:
        6px;
}


.bar > i {

    display:
        block;

    height:
        100%;

    background:
        #4f46e5;

    border-radius:
        20px;
}


.muted {

    color:
        #6b7280;

    font-size:
        13px;
}


/* ==========================================================
   状态区域
========================================================== */

.status {

    padding:
        16px
        18px;

    border-radius:
        12px;

    background:
        white;

    border:
        1px solid
        #e5e7eb;

    margin-bottom:
        18px;

    display:
        none;
}


.status.show {

    display:
        flex;

    align-items:
        center;

    gap:
        14px;
}


.status-text {

    line-height:
        1.6;

    flex: 1;
}


/* ==========================================================
   Loading
========================================================== */

.loader {

    width:
        24px;

    height:
        24px;

    border:
        3px solid
        #e5e7eb;

    border-top-color:
        #4f46e5;

    border-radius:
        50%;

    animation:
        spin .8s linear infinite;

    flex-shrink:
        0;
}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* ==========================================================
   进度条
========================================================== */

.progress {

    margin-top:
        10px;

    width:
        100%;

    height:
        6px;

    background:
        #eef0f5;

    border-radius:
        20px;

    overflow:
        hidden;
}


.progress-bar {

    height:
        100%;

    width:
        10%;

    background:
        #4f46e5;

    border-radius:
        20px;

    transition:
        width .6s ease;
}


/* ==========================================================
   空状态
========================================================== */

#empty {

    padding:
        80px
        20px;

    text-align:
        center;

    color:
        #8992a3;
}


/* ==========================================================
   广告结果
========================================================== */

.results {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap:
        18px;

    align-items:
        start;
}


.ad {

    border:
        1px solid
        #e5e7eb;

    border-radius:
        15px;

    overflow:
        hidden;

    background:
        #fff;
}


.ad img {

    width:
        100%;

    height:
        auto;

    display:
        block;

    background:
        #eef0f5;

    object-fit:
        contain;
}


.ad-body {

    padding:
        17px;
}


.badge {

    display:
        inline-block;

    padding:
        5px
        9px;

    border-radius:
        999px;

    background:
        #f0f1ff;

    color:
        #4338ca;

    font-size:
        12px;

    font-weight:
        700;

    margin-bottom:
        10px;
}


.copy {

    font-size:
        17px;

    line-height:
        1.8;

    white-space:
        pre-wrap;

    font-weight:
        600;
}


details {

    margin-top:
        15px;
}


summary {

    cursor:
        pointer;

    color:
        #4f46e5;

    font-size:
        13px;
}


.prompt {

    white-space:
        pre-wrap;

    color:
        #5b6473;

    font-size:
        12px;

    line-height:
        1.6;

    margin-top:
        8px;
}


/* ==========================================================
   策略
========================================================== */

.strategy {

    margin-top:
        14px;

    padding:
        12px;

    background:
        #f8fafc;

    border-radius:
        10px;

    font-size:
        13px;

    color:
        #5b6473;

    line-height:
        1.7;
}


/* ==========================================================
   评价
========================================================== */

.eval {

    margin-top:
        18px;

    padding:
        16px;

    background:
        #f8fafc;

    border-radius:
        12px;
}


.eval-grid {

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap:
        12px;
}


.eval-item label {

    font-size:
        13px;

    margin:
        0
        0
        5px;
}


select {

    width:
        100%;

    padding:
        9px;

    border:
        1px solid
        #d7dce5;

    border-radius:
        9px;

    background:
        white;
}


/* ==========================================================
   历史记录
========================================================== */

.history-panel {

    display:
        none;
}


.history-panel.show {

    display:
        block;
}


.history-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    margin-bottom:
        18px;

    gap:
        15px;
}


.history-header h2 {

    margin:
        0;
}


/* ==========================================================
   历史列表
========================================================== */

.history-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        12px;
}


.history-item {

    background:
        white;

    border:
        1px solid
        #e5e7eb;

    border-radius:
        14px;

    padding:
        18px;

    cursor:
        pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
}


.history-item:hover {

    transform:
        translateY(-2px);

    border-color:
        #c7c9ff;

    box-shadow:
        0 8px 25px
        rgba(20, 30, 50, .08);
}


.history-item-top {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    gap:
        15px;
}


.history-topic {

    font-size:
        17px;

    font-weight:
        700;

    color:
        #172033;
}


.history-time {

    font-size:
        12px;

    color:
        #8a93a3;

    white-space:
        nowrap;
}


.history-meta {

    margin-top:
        12px;

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;
}


.history-tag {

    padding:
        5px
        9px;

    border-radius:
        999px;

    background:
        #f3f4ff;

    color:
        #4f46e5;

    font-size:
        12px;

    font-weight:
        600;
}


.history-tag.gray {

    background:
        #f3f4f6;

    color:
        #6b7280;
}


/* ==========================================================
   历史MFT
========================================================== */

.history-mft {

    margin-top:
        15px;

    display:
        grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap:
        10px;
}


.history-mft-item {

    background:
        #f8fafc;

    padding:
        9px;

    border-radius:
        9px;

    text-align:
        center;

    font-size:
        12px;
}


.history-mft-score {

    margin-top:
        4px;

    font-size:
        15px;

    font-weight:
        700;

    color:
        #4338ca;
}


/* ==========================================================
   历史详情
========================================================== */

.history-detail {

    display:
        none;
}


.history-detail.show {

    display:
        block;
}


.history-detail-top {

    background:
        white;

    border:
        1px solid
        #e5e7eb;

    border-radius:
        15px;

    padding:
        18px;

    margin-bottom:
        18px;
}


.history-detail-title {

    font-size:
        22px;

    font-weight:
        700;

    margin-bottom:
        8px;
}


.history-detail-sub {

    color:
        #6b7280;

    font-size:
        13px;
}


/* ==========================================================
   详情MFT
========================================================== */

.detail-mft {

    display:
        grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap:
        10px;

    margin-top:
        16px;
}


.detail-mft-item {

    padding:
        12px;

    border-radius:
        10px;

    background:
        #f8fafc;

    text-align:
        center;
}


.detail-mft-name {

    font-size:
        12px;

    color:
        #6b7280;
}


.detail-mft-score {

    font-size:
        19px;

    font-weight:
        700;

    margin-top:
        4px;

    color:
        #4338ca;
}


/* ==========================================================
   历史评价
========================================================== */

.history-evaluation {

    margin-top:
        15px;

    padding:
        13px;

    background:
        #f8fafc;

    border-radius:
        10px;

    font-size:
        13px;

    line-height:
        1.8;
}


.history-evaluation hr {

    border:
        0;

    border-top:
        1px solid
        #e5e7eb;

    margin:
        10px
        0;
}


/* ==========================================================
   历史空状态
========================================================== */

.history-empty {

    background:
        white;

    border:
        1px solid
        #e5e7eb;

    border-radius:
        15px;

    padding:
        70px
        20px;

    text-align:
        center;

    color:
        #8a93a3;
}


/* ==========================================================
   响应式
========================================================== */

@media(max-width: 850px) {

    .grid {

        grid-template-columns:
            1fr;
    }


    .results {

        grid-template-columns:
            1fr;
    }


    .page-header {

        align-items:
            flex-start;

        flex-direction:
            column;
    }


    .history-mft,
    .detail-mft {

        grid-template-columns:
            repeat(2, 1fr);
    }


    .history-item-top {

        flex-direction:
            column;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- ======================================================

<header class="page-header">

<script>

/* ==========================================================
   MFT信息
========================================================== */

const foundationInfo = {

    care: [
        "Care / Harm",
        "关怀 / 伤害"
    ],

    fairness: [
        "Fairness / Cheating",
        "公平 / 欺骗"
    ],

    loyalty: [
        "Loyalty / Betrayal",
        "忠诚 / 背叛"
    ],

    authority: [
        "Authority / Subversion",
        "权威 / 颠覆"
    ],

    sanctity: [
        "Sanctity / Degradation",
        "神圣 / 堕落"
    ]

};


/* ==========================================================
   默认分数
========================================================== */

const scores = {

    care: 8,

    fairness: 5,

    loyalty: 4,

    authority: 3,

    sanctity: 5

};


let currentExperiment = null;

let currentAds = null;


/* ==========================================================
   历史评价缓存
========================================================== */

let currentHistoryEvaluations = [];


/* ==========================================================
   创建滑块
========================================================== */

function makeSliders() {

    const root =
        document.getElementById(
            "sliders"
        );


    Object.keys(
        foundationInfo
    ).forEach(key => {

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "score-row";


        row.innerHTML = `

            <div class="score-top">

                <span>
                    ${foundationInfo[key][1]}
                </span>

                <strong
                    id="${key}Value"
                >
                    ${scores[key].toFixed(1)}
                </strong>

            </div>

            <div class="muted">

                ${foundationInfo[key][0]}

            </div>

            <input
                id="${key}"
                type="range"
                min="0"
                max="10"
                step="0.1"
                value="${scores[key]}"
            >

        `;


        root.appendChild(row);


        row
            .querySelector("input")
            .addEventListener(
                "input",
                e => {

                    scores[key] =
                        Number(
                            e.target.value
                        );


                    document
                        .getElementById(
                            key + "Value"
                        )
                        .textContent =
                            scores[key]
                                .toFixed(1);


                    updateProfile();

                }
            );

    });


    updateProfile();

}


/* ==========================================================
   更新MFT画像
========================================================== */

function updateProfile() {

    const keys =
        Object.keys(
            scores
        );


    const sorted =
        [...keys].sort(
            (a, b) =>
                scores[b] -
                scores[a]
        );


    document.getElementById(
        "profile"
    ).innerHTML =

        keys.map(
            k => `

                <div
                    style="margin-top:10px"
                >

                    <div class="score-top">

                        <span>

/* ==========================================================
   HTML安全处理
========================================================== */

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================================
   格式化策略
========================================================== */

function formatStrategy(
    strategy
) {

    if (!strategy) {

        return "";

    }


    const emotion =
        Array.isArray(
            strategy.emotion
        )
        ?
        strategy.emotion
            .map(
                item =>
                    escapeHtml(item)
            )
            .join("、")
        :
        "";


    return `

        <b>核心价值：</b>
        ${escapeHtml(
            strategy.core_value || ""
        )}

        <br>

        <b>情绪：</b>
        ${emotion}

        <br>

        <b>叙事：</b>
        ${escapeHtml(
            strategy.narrative || ""
        )}

        <br>

        <b>视觉主体：</b>
        ${escapeHtml(
            strategy.visual_subject || ""
        )}

        <br>

        <b>视觉隐喻：</b>
        ${escapeHtml(
            strategy.visual_metaphor || ""
        )}

        <br>

        <b>构图：</b>
        ${escapeHtml(
            strategy.composition || ""
        )}

        <br>

        <b>光影：</b>
        ${escapeHtml(
            strategy.lighting || ""
        )}

        <br>

        <b>字体风格：</b>
        ${escapeHtml(
            strategy.typography_style || ""
        )}

    `;

}


/* ==========================================================
   生成
========================================================== */

async function generate() {

    const topic =
        document
            .getElementById(
                "topic"
            )
            .value
            .trim();


    if (!topic) {

        alert(
            "请先输入公益广告主题。"
        );

        return;

    }


    const btn =
        document.getElementById(
            "generate"
        );


    btn.disabled =
        true;


    const loader =
        document.getElementById(
            "loader"
        );


    loader.style.display =
        "block";


    document.getElementById(
        "empty"
    ).style.display =
        "block";


    document.getElementById(
        "results"
    ).style.display =
        "none";


    setStatus(
        "AI正在分析MFT画像并设计两套不同的道德诉求……",
        true,
        10
    );


    let progress = 10;


    const progressTimer =
        setInterval(
            () => {

                if (
                    progress < 88
                ) {

                    progress += 2;


                    document
                        .getElementById(
                            "progressBar"
                        )
                        .style.width =
                            progress + "%";

                }

            },
            1000
        );


    const messageTimer1 =
        setTimeout(
            () => {

                setStatus(
                    "AI策略已经生成，正在并行生成两张竖版公益海报……",
                    true,
                    35
                );

            },
            5000
        );


    const messageTimer2 =
        setTimeout(
            () => {

                setStatus(
                    "两张海报正在同时生成和下载，请稍候……",
                    true,
                    60
                );

            },
            15000
        );


    const messageTimer3 =
        setTimeout(
            () => {

                setStatus(
                    "图片已经生成，正在保存海报并整理实验数据……",
                    true,
                    85
                );

            },
            30000
        );


    try {

        const res =
            await fetch(
                "/api/generate",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            topic,

                            mft:
                                scores

                        })

                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            throw new Error(
                data.detail ||
                "生成失败"
            );

        }


        currentExperiment =
            data.experiment_id;


        currentAds =
            data;


        /* --------------------------------------------------
           匹配广告
        -------------------------------------------------- */

        document.getElementById(
            "matchedImg"
        ).src =
            data.matched.image_url;


        document.getElementById(
            "matchedCopy"
        ).textContent =
            data.matched.copy;


        document.getElementById(
            "matchedPrompt"
        ).textContent =
            data.matched.image_prompt;


        document.getElementById(
            "matchedBadge"
        ).textContent =

            "匹配条件 · "

            +

            data.matched.foundation;


        document.getElementById(
            "matchedStrategy"
        ).innerHTML =
            formatStrategy(
                data.matched.strategy
            );


        /* --------------------------------------------------
           不匹配广告
        -------------------------------------------------- */

        document.getElementById(
            "unmatchedImg"
        ).src =
            data.unmatched.image_url;


        document.getElementById(
            "unmatchedCopy"
        ).textContent =
            data.unmatched.copy;


        document.getElementById(
            "unmatchedPrompt"
        ).textContent =
            data.unmatched.image_prompt;


        document.getElementById(
            "unmatchedBadge"
        ).textContent =

            "不匹配条件 · "

            +

            data.unmatched.foundation;


        document.getElementById(
            "unmatchedStrategy"
        ).innerHTML =
            formatStrategy(
                data.unmatched.strategy
            );


        /* --------------------------------------------------
           显示结果
        -------------------------------------------------- */

        document.getElementById(
            "empty"
        ).style.display =
            "none";


        document.getElementById(
            "results"
        ).style.display =
            "grid";


        setSuccessStatus();

    }


    catch (err) {

        setErrorStatus(
            err.message
        );

    }


    finally {

        clearInterval(
            progressTimer
        );

        clearTimeout(
            messageTimer1
        );

        clearTimeout(
            messageTimer2
        );

        clearTimeout(
            messageTimer3
        );


        btn.disabled =
            false;

    }

}


/* ==========================================================
   提交评价
========================================================== */

async function submitEval(
    condition
) {

    if (!currentAds) {

        alert(
            "请先生成广告。"
        );

        return;

    }


    const p =
        condition === "matched"
        ? "m"
        : "u";


    const ad =
        currentAds[
            condition
        ];


    const body = {

        experiment_id:
            currentExperiment,

        ad_id:
            ad.ad_id,

        moral_resonance:
            Number(
                document.getElementById(
                    p + "_moral"
                ).value
            ),

        emotional_response:
            Number(
                document.getElementById(
                    p + "_emotion"
                ).value
            ),

        persuasion:
            Number(
                document.getElementById(
                    p + "_persuasion"
                ).value
            ),

        behavioral_intention:
            Number(
                document.getElementById(
                    p + "_behavior"
                ).value
            )

    };


    try {

        const res =
            await fetch(
                "/api/evaluate",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            body
                        )

                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            throw new Error(
                data.detail ||
                "提交失败"
            );

        }


        alert(
            "评价已保存。"
        );


    }

    catch (err) {

        alert(
            err.message
        );

    }

}

/* ==========================================================
   日期格式化
========================================================== */

function formatDate(
    value
) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return value;

    }


    return date.toLocaleString(

        "zh-CN",

        {

            year:
                "numeric",

            month:
                "2-digit",

            day:
                "2-digit",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }

    );

}
